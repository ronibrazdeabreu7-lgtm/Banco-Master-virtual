{% extends "base.html" %}

{% block title %}Pix — Banco Inter Virtual{% endblock %}

{% block content %}

<div class="page-header">
    <div>
        <span class="eyebrow">PAGAMENTOS</span>
        <h1>Pix</h1>
        <p>Transfira valores entre contas fictícias do laboratório.</p>
    </div>
</div>

<div class="form-card">

    <div class="pix-symbol">P</div>

    <h2>Enviar Pix</h2>

    <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <label for="destination">Conta de destino</label>

        <input
            id="destination"
            name="destination"
            type="text"
            inputmode="numeric"
            placeholder="Ex.: 00000002"
            required
        >

        <label for="amount">Valor</label>

        <input
            id="amount"
            name="amount"
            type="number"
            min="0.01"
            step="0.01"
            placeholder="0,00"
            required
        >

        <button class="primary-button" type="submit">
            Confirmar Pix
        </button>

    </form>

    <div class="lab-warning">
        <strong>Simulação</strong>
        <p>
            A operação movimenta somente os saldos fictícios deste ambiente.
        </p>
    </div>

</div>

{% endblock %}
